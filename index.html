<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Collapse — $35 Billion Margin Call</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    position: relative;
    min-height: 100vh;
    background-image: url('poster.jpg');
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 6vh;
  }

  /* subtle overlay to make the button pop without dimming the whole poster too much */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 25%);
    pointer-events: none;
    z-index: 1;
  }

  .cta-btn {
    position: relative;
    z-index: 2;
    display: inline-block;
    padding: 18px 48px;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    color: #fff;
    background: linear-gradient(135deg, #b31217, #e52d27 60%, #b31217);
    border: 2px solid #ff4d4d;
    border-radius: 6px;
    box-shadow: 0 0 25px rgba(229, 45, 39, 0.7), 0 8px 20px rgba(0,0,0,0.5);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    animation: pulse 2.2s infinite;
  }

  .cta-btn:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 0 40px rgba(255, 77, 77, 0.9), 0 10px 25px rgba(0,0,0,0.6);
    background: linear-gradient(135deg, #e52d27, #ff4d4d 60%, #e52d27);
  }

  .cta-btn:active {
    transform: translateY(0) scale(0.98);
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 25px rgba(229, 45, 39, 0.7), 0 8px 20px rgba(0,0,0,0.5); }
    50%  { box-shadow: 0 0 40px rgba(255, 77, 77, 0.95), 0 8px 20px rgba(0,0,0,0.5); }
    100% { box-shadow: 0 0 25px rgba(229, 45, 39, 0.7), 0 8px 20px rgba(0,0,0,0.5); }
  }

  @media (max-width: 480px) {
    .cta-btn {
      padding: 14px 32px;
      font-size: 1rem;
      letter-spacing: 1.5px;
    }
    body {
      background-position: center;
      padding-bottom: 8vh;
    }
  }
</style>
</head>
<body>
  <a href="collapse.html" class="cta-btn">See Full Report</a>
</body>
</html>
